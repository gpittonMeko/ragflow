name: Build SIM Redirect APK

on:
  push:
    branches:
      - agent/sim-redirect-build
    paths:
      - 'simredirect-build/**'
      - '.github/workflows/build-simredirect.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simredirect-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sim-redirect-apk
          path: simredirect-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
