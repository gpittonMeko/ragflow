name: Build OpenClaw Mobile APK

on:
  push:
    branches:
      - chatgpt/openclaw-android-build-v6
    paths:
      - 'openclaw-mobile/**'
      - '.github/workflows/openclaw-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle -p openclaw-mobile --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p openclaw-mobile --no-daemon :app:assembleDebug

      - name: Verify APK package
        run: |
          APK="openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep "package: name='it.meko.openclawmobile'"
          "$AAPT" dump badging "$APK" | grep "launchable-activity: name='it.meko.openclawmobile.OpenClawV5Activity'"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            APK="openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="it.meko.openclawmobile"
            ACTIVITY="$PACKAGE/.OpenClawV5Activity"
            adb install -r "$APK"
            adb shell am force-stop "$PACKAGE" || true
            adb logcat -c
            adb shell am start -W -n "$ACTIVITY"
            sleep 4
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              echo "OpenClaw Mobile process is not alive after launch"
              adb logcat -d -t 300 | grep -E "$PACKAGE|AndroidRuntime|FATAL EXCEPTION" || true
              exit 1
            fi
            echo "OpenClaw Mobile running as PID $PID"
            adb shell dumpsys activity top | grep -E "OpenClawV5Activity|$PACKAGE" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Mobile-APK
          path: openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
