name: Build OpenClaw Mobile APK

on:
  push:
    branches:
      - chatgpt/openclaw-android-build-v6
    paths:
      - 'openclaw-mobile/**'
      - '.github/workflows/openclaw-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle -p openclaw-mobile --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p openclaw-mobile --no-daemon :app:assembleDebug

      - name: Verify APK package
        run: |
          APK="openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep "package: name='it.meko.openclawmobile'"
          "$AAPT" dump badging "$APK" | grep "launchable-activity: name='it.meko.openclawmobile.OpenClawV5Activity'"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            mkdir -p "${{ github.workspace }}/openclaw-smoke"
            adb devices -l | tee "${{ github.workspace }}/openclaw-smoke/devices.txt"
            ls -l "${{ github.workspace }}/openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk" | tee "${{ github.workspace }}/openclaw-smoke/apk-ls.txt"
            adb install -r "${{ github.workspace }}/openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk" | tee "${{ github.workspace }}/openclaw-smoke/install.txt"
            adb shell am force-stop it.meko.openclawmobile || true
            adb logcat -c
            adb shell am start -W -n it.meko.openclawmobile/.OpenClawV5Activity | tee "${{ github.workspace }}/openclaw-smoke/start.txt"
            sleep 5
            adb shell pidof it.meko.openclawmobile | tee "${{ github.workspace }}/openclaw-smoke/pid.txt" | grep -E '[0-9]+'
            adb shell dumpsys activity top > "${{ github.workspace }}/openclaw-smoke/activity-top.txt" 2>&1
            adb logcat -d -t 500 > "${{ github.workspace }}/openclaw-smoke/logcat.txt" 2>&1
            touch "${{ github.workspace }}/openclaw-smoke/PASSED"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Mobile-Smoke-Diagnostics
          path: openclaw-smoke
          if-no-files-found: warn
          retention-days: 3

      - name: Assert emulator smoke test
        run: |
          test -f openclaw-smoke/PASSED
          echo "Emulator install + cold launch passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Mobile-APK
          path: openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
