name: Build OpenClaw Mobile APK

on:
  push:
    branches:
      - chatgpt/openclaw-android-build-v6
    paths:
      - 'openclaw-mobile/**'
      - '.github/workflows/openclaw-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle -p openclaw-mobile --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p openclaw-mobile --no-daemon :app:assembleDebug

      - name: Verify APK package
        run: |
          APK="openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep "package: name='it.meko.openclawmobile'"
          "$AAPT" dump badging "$APK" | grep "launchable-activity: name='it.meko.openclawmobile.OpenClawV5Activity'"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Emulator install and launch smoke test
        id: emulator_smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p /tmp/openclaw-smoke
            APK="openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="it.meko.openclawmobile"
            ACTIVITY="$PACKAGE/.OpenClawV5Activity"

            set +e
            adb devices -l > /tmp/openclaw-smoke/devices.txt 2>&1
            adb install -r "$APK" > /tmp/openclaw-smoke/install.txt 2>&1
            INSTALL_RC=$?
            echo "$INSTALL_RC" > /tmp/openclaw-smoke/install.rc
            adb shell am force-stop "$PACKAGE" >> /tmp/openclaw-smoke/install.txt 2>&1
            adb logcat -c
            adb shell am start -W -n "$ACTIVITY" > /tmp/openclaw-smoke/start.txt 2>&1
            START_RC=$?
            echo "$START_RC" > /tmp/openclaw-smoke/start.rc
            sleep 5
            PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r')"
            echo "$PID" > /tmp/openclaw-smoke/pid.txt
            adb shell dumpsys activity top > /tmp/openclaw-smoke/activity-top.txt 2>&1
            adb logcat -d -t 500 > /tmp/openclaw-smoke/logcat.txt 2>&1

            if [ "$INSTALL_RC" -eq 0 ] && [ "$START_RC" -eq 0 ] && [ -n "$PID" ]; then
              touch /tmp/openclaw-smoke/PASSED
              echo "OpenClaw Mobile running as PID $PID"
              exit 0
            fi

            echo "Smoke test failed: install=$INSTALL_RC start=$START_RC pid='${PID}'"
            cat /tmp/openclaw-smoke/install.txt || true
            cat /tmp/openclaw-smoke/start.txt || true
            grep -E "$PACKAGE|AndroidRuntime|FATAL EXCEPTION|Process:" /tmp/openclaw-smoke/logcat.txt | tail -n 160 || true
            exit 1

      - name: Print smoke diagnostics
        if: always()
        run: |
          echo '--- devices ---'
          cat /tmp/openclaw-smoke/devices.txt 2>/dev/null || true
          echo '--- install ---'
          cat /tmp/openclaw-smoke/install.txt 2>/dev/null || true
          echo '--- start ---'
          cat /tmp/openclaw-smoke/start.txt 2>/dev/null || true
          echo '--- pid ---'
          cat /tmp/openclaw-smoke/pid.txt 2>/dev/null || true
          echo '--- relevant logcat ---'
          grep -E 'it.meko.openclawmobile|AndroidRuntime|FATAL EXCEPTION|Process:' /tmp/openclaw-smoke/logcat.txt 2>/dev/null | tail -n 200 || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Mobile-Smoke-Diagnostics
          path: /tmp/openclaw-smoke
          if-no-files-found: warn
          retention-days: 3

      - name: Assert emulator smoke test
        run: test -f /tmp/openclaw-smoke/PASSED

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Mobile-APK
          path: openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
