name: Build OpenClaw Mobile APK

on:
  push:
    branches:
      - chatgpt/openclaw-android-build-v6
    paths:
      - 'openclaw-mobile/**'
      - '.github/workflows/openclaw-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle -p openclaw-mobile --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk
          ls -lh openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Mobile-APK
          path: openclaw-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
