name: Build VitaFocus APK

on:
  push:
    branches:
      - 'build/vitafocus-fixed-*'
    paths:
      - 'vitafocus-v12/**'
      - '.github/workflows/build-vitafocus.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'vitafocus-v12/**'
      - '.github/workflows/build-vitafocus.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: vitafocus-v12
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp vitafocus-v12/app/build/outputs/apk/debug/app-debug.apk artifact/VitaFocus-v1.2.0.apk
          sha256sum artifact/VitaFocus-v1.2.0.apk > artifact/VitaFocus-v1.2.0-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VitaFocus-v1.2.0
          path: artifact/*
          retention-days: 7
