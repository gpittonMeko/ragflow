name: Build VitaFocus APK

on:
  push:
    branches:
      - 'build/vitafocus-fixed-*'
    paths:
      - 'vitafocus-fixed/project.b64'
      - '.github/workflows/build-vitafocus.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'vitafocus-fixed/project.b64'
      - '.github/workflows/build-vitafocus.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Android project
        run: |
          mkdir -p vitafocus-build
          base64 -d vitafocus-fixed/project.b64 > /tmp/vitafocus-project.zip
          unzip -q /tmp/vitafocus-project.zip -d vitafocus-build
      - name: Build debug APK
        working-directory: vitafocus-build
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp vitafocus-build/app/build/outputs/apk/debug/app-debug.apk artifact/VitaFocus-fixed-v1.1.0.apk
          sha256sum artifact/VitaFocus-fixed-v1.1.0.apk > artifact/VitaFocus-fixed-v1.1.0-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VitaFocus-fixed-v1.1.0
          path: artifact/*
          retention-days: 7
